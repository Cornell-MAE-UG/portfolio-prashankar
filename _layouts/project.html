---
layout: default
---
<div>
  <p><img src="{{ page.image | relative_url }}" alt="{{ page.imagealt }}" class="project-image" /></p>
  <h1>{{ page.title }}</h1>
  <p>{{ page.description }}</p>
  <p><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>
</div>

<div> 
  {{ content }}
</div>

<a href={{ "/projects/" | relative_url }} class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
</a>

<!-- Mathjax Support -->
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
  window.MathJax = {
    loader: {load: ['[tex]/cancel']}, // Add this line to load the package
    tex: {
      packages: {'[+]': ['cancel']},  // Enable the package in the TeX engine
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    chtml: {
      scale: 0.92, 
      minScale: 0.5
    }
  };
</script>
